site_name: Персональный сайт HANIBEK
site_description: Это мой сайт, таких сайтов много
site_author: Maxim
site_url: https://smthsmth.com

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Тyoмная тема
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share

nav:
  - Главная: index.md
  - О себе: about.md
  - Проекты: projects.md
  - Достижения: achievements.md
  - Контакты: contacts.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables

plugins:
  - search
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Cahara-X
    - icon: fontawesome/brands/telegram
      link: https://t.me/Belongon4cross

copyright: © 2026 MAXIM HANIBEK
